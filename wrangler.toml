name = "pc-trust-mcp"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
AFFILIATE_TAG_AMAZON = "pctrust01-20"
AFFILIATE_TAG_NEWEGG = "pctrust_mcp"
AFFILIATE_TAG_BESTBUY = "pctrust"

[[d1_databases]]
binding = "DB"
database_name = "pc-trust-db"
database_id = "local-pc-trust-db"
migrations_dir = "migrations"

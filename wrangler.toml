name = "spectrust"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

[vars]
ENVIRONMENT = "production"
AFFILIATE_TAG_AMAZON = "spectrust-20"
AFFILIATE_TAG_NEWEGG = "spectrust"
AFFILIATE_TAG_BESTBUY = "spectrust"

[[d1_databases]]
binding = "DB"
database_name = "spectrust-db"
database_id = "06b42554-9319-4643-95a4-00e03b9909c9"
migrations_dir = "migrations"
